<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Login - Modern Auth System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --primary-smoky: #1e3a8a;
            --secondary: #4f46e5;
            --secondary-smoky: #3730a3;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-dark: #0f172a;
            --text-light: #475569;
            --bg-light: #f1f5f9;
            --bg-white: #ffffff;
            --bg-smoky: #eef2ff;
            --border: #cbd5e1;
            --radius: 12px;
            --transition: all 0.2s ease;
            --gradient-start: #2563eb;
            --gradient-end: #4f46e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f0ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-light);
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
            margin: 10px;
            color: var(--text-light);
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: transparent;
            color: var(--text-dark);
            padding: 32px 28px 20px 28px;
            text-align: center;
            border-bottom: 1px solid rgba(37, 99, 235, 0.1);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-container {
            padding: 28px;
            position: relative;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 13px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 40px 14px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
            outline: none;
            font-family: inherit;
            background: var(--bg-light);
            color: var(--text-dark);
        }

        input:focus {
            border-color: var(--primary);
            background: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
        }

        .input-icon:hover {
            color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-smoky));
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-password a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(37, 99, 235, 0.1);
            color: var(--text-light);
            font-size: 14px;
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .register-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            max-width: 90%;
            min-width: 280px;
            padding: 14px 20px;
            border-radius: 12px;
            display: none;
            z-index: 9999;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .alert.success {
            display: block;
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .alert.error {
            display: block;
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            border-left: 4px solid var(--error);
        }

        .loader {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 9998;
        }

        .loader.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 0;
                align-items: flex-start;
            }
            
            .container {
                max-width: 100%;
                border-radius: 0;
                margin: 0;
                height: 100vh;
                max-height: 100vh;
                overflow-y: auto;
            }
            
            .form-container {
                padding: 24px 20px 32px 20px;
            }
            
            .header {
                padding: 40px 24px 20px 24px;
            }
            
            .header h1 {
                font-size: 28px;
            }
            
            .alert {
                top: 10px;
                width: calc(100% - 20px);
                max-width: calc(100% - 20px);
                font-size: 13px;
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 20px 16px 28px 16px;
            }
            
            .header {
                padding: 32px 20px 16px 20px;
            }
            
            .header h1 {
                font-size: 26px;
            }
            
            input {
                padding: 12px 36px 12px 12px;
                font-size: 16px;
            }
            
            .btn-login {
                padding: 12px;
                font-size: 15px;
            }
        }

        /* Prevent zoom on input focus for mobile */
        @media (max-width: 768px) {
            input {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your account</p>
        </div>
       <br><br><br>
        <div class="form-container">
            <div id="alert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
                        <span class="input-icon">📧</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                        <span class="input-icon" id="togglePassword" style="cursor: pointer;">👁️</span>
                    </div>
                    <div class="forgot-password">
                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
                
                <div class="register-link">
                    Don't have an account? <a href="register.html">Create Account</a>
                </div>
            </form>
        </div>
    </div>
    
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api';
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');
        const loader = document.getElementById('loader');
        const togglePassword = document.getElementById('togglePassword');

        // Toggle password visibility
        let isPasswordVisible = false;
        togglePassword.addEventListener('click', function() {
            isPasswordVisible = !isPasswordVisible;
            passwordInput.type = isPasswordVisible ? 'text' : 'password';
            this.textContent = isPasswordVisible ? '🙈' : '👁️';
        });

        // Show alert message
        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert ${type}`;
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                hideAlert();
            }, 3000);
        }

        function hideAlert() {
            alertDiv.className = 'alert';
        }

        // Show/hide loader
        function showLoader() {
            loader.classList.add('active');
        }

        function hideLoader() {
            loader.classList.remove('active');
        }

        // Validate email
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Log login attempt with credentials (for debugging)
            console.log('=== Login Attempt ===');
            console.log('Email:', email);
            console.log('Password:', password);
            console.log('====================');
            
            // Validation
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('Please enter a valid email address', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }
            
            showLoader();
            loginBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                console.log(`📤 Login request sent to ${API_BASE_URL}/auth/login`);
                console.log(`📥 Response status: ${response.status}`);
                
                let data;
                const contentType = response.headers.get('content-type') || '';
                console.log(`📋 Response content-type: ${contentType}`);
                
                if (contentType.includes('application/json')) {
                    data = await response.json();
                    console.log(`✅ JSON parsed successfully:`, data);
                } else {
                    const text = await response.text();
                    console.log(`⚠️ Non-JSON response received (${text.substring(0, 100)}...)`);
                    console.error(`❌ Server returned ${contentType} instead of JSON`);
                    showAlert('Server error: Invalid response format. Please contact support.', 'error');
                    return;
                }
                
                if (response.ok) {
                    // Store token in localStorage
                    const token = data?.data?.token;
                    const user = data?.data?.user;
                    if (token) {
                        localStorage.setItem('access_token', token);
                        localStorage.setItem('user', JSON.stringify(user || {}));
                        console.log(`✅ Token saved to localStorage`);
                    }
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Redirect to dashboard or home page after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    console.error(`❌ Login failed with status ${response.status}:`, data);
                    // Check if it's an authentication error (401) or invalid credentials
                    if (response.status === 401 || response.status === 400) {
                        showAlert('Invalid credentials. Please try again.', 'error');
                    } else {
                        showAlert(data.message || 'Login failed. Please try again.', 'error');
                    }
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                console.error('Error stack:', error?.stack);
                showAlert('Network error. Please make sure the server is running at ' + API_BASE_URL, 'error');
            } finally {
                hideLoader();
                loginBtn.disabled = false;
            }
        });
        
        // Add input animations and validation
        emailInput.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        emailInput.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
        
        passwordInput.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        passwordInput.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
        
        // Check if user is already logged in
        const token = localStorage.getItem('access_token');
        if (token) {
            // Optional: Verify token with server
            console.log('User already logged in');
            // Uncomment to auto redirect
            // window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
