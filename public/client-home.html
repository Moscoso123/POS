<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BluePOS Client | Counter & Reservations</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        :root {
            --primary: #0f62fe;
            --primary-dark: #0a4bc2;
            --secondary: #14b8a6;
            --accent: #f59e0b;
            --text-dark: #0b1220;
            --text-light: #4b5563;
            --bg-light: #f8fbff;
            --bg-white: #ffffff;
            --border: #dbe5f0;
            --radius: 18px;
            --card-shadow: 0 12px 30px rgba(15, 34, 66, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 6% 8%, rgba(20, 184, 166, 0.14), transparent 42%),
                radial-gradient(circle at 88% 4%, rgba(15, 98, 254, 0.14), transparent 40%),
                #f6f9ff;
            color: var(--text-dark);
        }

        .topbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(15, 98, 254, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(120deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            border: 1px solid rgba(11, 18, 32, 0.12);
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-light);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
        }

        .tabbar {
            display: flex;
            gap: 8px;
            padding: 16px 20px 0;
            flex-wrap: wrap;
        }

        .tab {
            border: 1px solid #d6e2f0;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-light);
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tab.active {
            background: linear-gradient(120deg, var(--primary) 0%, #2363d5 60%, var(--secondary) 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(15, 98, 254, 0.2);
        }

        .page-container {
            padding: 20px;
        }

        .panel {
            background: white;
            border-radius: 20px;
            border: 1px solid #dbe5f0;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .pos-layout {
            display: flex;
            flex-wrap: nowrap;
            align-items: stretch;
        }

        .products-grid {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 0;
            display: grid;
            grid-template-columns: repeat(5, minmax(90px, 1fr));
            justify-content: center;
            column-gap: 8px;
            row-gap: 8px;
            align-content: start;
            border-right: 1px solid #e6edf6;
        }

        .products-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 6px 0 2px;
            flex-shrink: 0;
        }
        .page-nav-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 999px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .page-nav-btn:disabled { opacity: 0.3; cursor: default; }
        .page-nav-btn:not(:disabled):hover { background: var(--bg-light); }
        .page-nav-info {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            min-width: 44px;
            text-align: center;
        }

        .products-panel {
            flex: 2;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height:490px;
        }

        .products-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid #dbe5f0;
            border-radius: 14px;
            background: linear-gradient(180deg, #ffffff 0%, #f9fcff 100%);
        }

        .products-search {
            flex: 1;
            min-width: 180px;
            border: 1px solid #d7e4f4;
            border-radius: 999px;
            height: 38px;
            padding: 0 14px;
            font-size: 14px;
            outline: none;
        }

        .products-search:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.12);
        }

        .product-tile {
            background: linear-gradient(145deg, #f6fbff 0%, #eef5ff 100%);
            border-radius: 16px;
            padding: 7px 8px 8px;
            aspect-ratio: 1 / 1;
            min-height: 108px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-tile:hover {
            border-color: var(--primary);
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(14, 69, 141, 0.1);
        }

        .product-topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .stock-pill {
            font-size: 10px;
            font-weight: 700;
            color: #0f766e;
            background: #ccfbf1;
            padding: 1px 7px;
            border-radius: 999px;
            border: 1px solid #99f6e4;
        }

        .pill-bump {
            animation: pillBump 180ms ease;
        }

        .pill-drop {
            animation: pillDrop 180ms ease;
        }

        @keyframes pillBump {
            0% { transform: scale(0.85); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pillDrop {
            0% { transform: translateY(-5px); opacity: 0.45; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .cart-section {
            flex: 1.2;
            padding: 16px;
            border-left: 1px solid #e6edf6;
        }

        .cart-items-list {
            min-height: 220px;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
            gap: 6px;
        }

        .cart-item-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .qty-controls {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #d7e4f4;
            border-radius: 999px;
            padding: 2px;
            background: #f8fbff;
        }

        .qty-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 999px;
            background: #ffffff;
            color: #1e3a8a;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
        }

        .qty-chip {
            min-width: 24px;
            text-align: center;
            font-weight: 700;
            color: #0f1f3c;
            font-size: 13px;
            display: inline-block;
        }

        .qty-shift-down {
            animation: qtyShiftDown 180ms ease;
        }

        .qty-shift-up {
            animation: qtyShiftUp 180ms ease;
        }

        @keyframes qtyShiftDown {
            0% { transform: translateY(-5px); opacity: 0.4; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes qtyShiftUp {
            0% { transform: translateY(5px); opacity: 0.4; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .btn-primary {
            background: linear-gradient(120deg, var(--primary) 0%, #2363d5 60%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 10px 20px rgba(15, 98, 254, 0.18);
        }

        .btn-secondary {
            background: white;
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .client-hero {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .hero-stat {
            border: 1px solid #dbe5f0;
            background: rgba(255, 255, 255, 0.86);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 6px 14px rgba(15, 34, 66, 0.06);
        }

        .hero-stat .label {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }

        .hero-stat .value {
            font-size: 22px;
            font-weight: 800;
            color: #0f1f3c;
        }

        .reservation-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .field input, .field select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: #f3f8ff;
            font-weight: 600;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-upcoming { color: #1d4ed8; background: #dbeafe; }
        .status-soon { color: #92400e; background: #fef3c7; }
        .status-completed { color: #166534; background: #dcfce7; }
        .status-pending { color: #92400e; background: #fef3c7; }
        .status-approved { color: #166534; background: #dcfce7; }
        .status-rejected { color: #991b1b; background: #fee2e2; }

        .logout-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(11, 18, 32, 0.45);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.22s ease, visibility 0.22s ease;
            z-index: 120;
        }

        .logout-modal-backdrop.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .logout-modal {
            width: min(92vw, 380px);
            background: #ffffff;
            border: 1px solid #dbe5f0;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 50px rgba(15, 34, 66, 0.2);
            transform: translateY(14px) scale(0.98);
            transition: transform 0.24s cubic-bezier(0.2, 0.75, 0.2, 1);
        }

        .logout-modal-backdrop.open .logout-modal {
            transform: translateY(0) scale(1);
        }

        .logout-modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f1f3c;
        }

        .logout-modal-text {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        .logout-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media (max-width: 900px) {
            .pos-layout { flex-direction: column; }
            .products-panel {
                flex: none !important;
                padding: 14px !important;
                border-right: none !important;
                height: auto !important;
            }
            .products-grid {
                flex: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
                grid-template-columns: repeat(2, minmax(130px, 1fr));
                justify-content: center;
                column-gap: 10px;
                row-gap: 10px;
                padding-bottom: 6px;
                align-content: start;
            }
            .product-tile {
                min-height: 130px;
            }
            .cart-section {
                border-left: none;
                border-top: 1px solid #e6edf6;
                padding: 12px 14px 10px;
            }
            .cart-items-list {
                min-height: 130px;
                max-height: 220px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="material-symbols-outlined">point_of_sale</span>BluePOS Client</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <nav class="tabbar">
        <button class="tab active" data-page="counter"><span class="material-symbols-outlined">shopping_cart</span>POS Counter</button>
        <button class="tab" data-page="reservations"><span class="material-symbols-outlined">event_seat</span>Reservations</button>
        <button class="tab" data-page="product-reservations"><span class="material-symbols-outlined">fact_check</span>Product Reservations</button>
    </nav>

    <main class="page-container" id="pageContent"></main>

    <div class="logout-modal-backdrop" id="logoutModalBackdrop" aria-hidden="true">
        <div class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logoutModalTitle">
            <h3 class="logout-modal-title" id="logoutModalTitle">Confirm Logout</h3>
            <p class="logout-modal-text">Do you want to logout now?</p>
            <div class="logout-modal-actions">
                <button class="btn-secondary" id="logoutCancelBtn" type="button">Cancel</button>
                <button class="btn-primary" id="logoutConfirmBtn" type="button" style="width:auto; padding:10px 16px;">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const storedUser = JSON.parse(localStorage.getItem('user') || '{}');
        const accessToken = localStorage.getItem('access_token');
        if (!storedUser || storedUser.userType !== 'client') {
            window.location.href = 'login.html';
        }
        if (!accessToken) {
            window.location.href = 'login.html';
        }

        const RESERVATION_STORAGE_KEY = 'bluepos_reservations_v1';
        const API_BASE_URL = window.location.origin + '/api';
        let reservations = [];
        let myProductReservations = [];
        let cart = [];
        let previousCartQuantities = {};
        let currentPage = 'counter';
        let products = [];
        let isProductsLoading = true;
        let productSearchTerm = '';
        let cardAnimationState = {};
        let productsPage = 0;

        const categoryToIcon = {
            beverages: 'local_cafe',
            drinks: 'local_bar',
            coffee: 'coffee',
            food: 'lunch_dining',
            snacks: 'bakery_dining',
            dessert: 'cake'
        };

        const logoutModalBackdrop = document.getElementById('logoutModalBackdrop');
        const logoutCancelBtn = document.getElementById('logoutCancelBtn');
        const logoutConfirmBtn = document.getElementById('logoutConfirmBtn');

        function openLogoutModal() {
            if (!logoutModalBackdrop) return;
            logoutModalBackdrop.classList.add('open');
            logoutModalBackdrop.setAttribute('aria-hidden', 'false');
        }

        function closeLogoutModal() {
            if (!logoutModalBackdrop) return;
            logoutModalBackdrop.classList.remove('open');
            logoutModalBackdrop.setAttribute('aria-hidden', 'true');
        }

        function resolveProductIcon(product) {
            const key = String(product?.category || '').trim().toLowerCase();
            return categoryToIcon[key] || 'shopping_bag';
        }

        async function fetchProductsFromApi() {
            isProductsLoading = true;
            if (currentPage === 'counter') {
                renderCounter();
            }

            try {
                const response = await fetch(`${API_BASE_URL}/products`, {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load products');
                }

                const data = await response.json();
                const list = Array.isArray(data) ? data : Array.isArray(data?.data) ? data.data : [];

                products = list
                    .filter((p) => (p?.is_active !== false))
                    .map((p) => ({
                        id: p.id,
                        name: p.name,
                        price: Number(p.price || 0),
                        icon: resolveProductIcon(p),
                        stock: Number(p.stock_quantity || 0)
                    }))
                    .filter((p) => p.name && p.price >= 0 && p.stock > 0);

                isProductsLoading = false;
                renderCounter();
            } catch (error) {
                products = [];
                isProductsLoading = false;
                renderCounter('Unable to load products from server.');
            }
        }

        async function fetchMyProductReservations() {
            try {
                const response = await fetch(`${API_BASE_URL}/product-reservations/my`, {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load your reservations');
                }

                const payload = await response.json();
                myProductReservations = Array.isArray(payload?.data) ? payload.data : [];

                if (currentPage === 'product-reservations') {
                    renderProductReservations();
                }
            } catch {
                myProductReservations = [];
                if (currentPage === 'product-reservations') {
                    renderProductReservations('Unable to load product reservation requests.');
                }
            }
        }

        function loadReservationsFromStorage() {
            try {
                const raw = localStorage.getItem(RESERVATION_STORAGE_KEY);
                reservations = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(reservations)) reservations = [];
            } catch {
                reservations = [];
            }
        }

        function saveReservationsToStorage() {
            localStorage.setItem(RESERVATION_STORAGE_KEY, JSON.stringify(reservations));
        }

        function getReservationStatus(date, time) {
            const when = new Date(`${date}T${time}`);
            if (Number.isNaN(when.getTime())) return 'Upcoming';
            const now = new Date();
            if (when < now) return 'Completed';
            if (when.getTime() - now.getTime() <= 60 * 60 * 1000) return 'Soon';
            return 'Upcoming';
        }

        function formatReservationDate(date, time) {
            const when = new Date(`${date}T${time}`);
            if (Number.isNaN(when.getTime())) return `${date} ${time}`;
            return when.toLocaleString([], {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: 'numeric', minute: '2-digit'
            });
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cartItemsList');
            const totalSpan = document.getElementById('cartTotal');
            if (!cartContainer) return;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<div style="padding:6px 0;"></div>';
                if (totalSpan) totalSpan.textContent = '0.00';
                return;
            }

            let total = 0;
            cartContainer.innerHTML = cart.map((item, idx) => {
                const subtotal = item.price * item.quantity;
                const previousQty = Number(previousCartQuantities[item.id] || 0);
                const quantityClass = item.quantity < previousQty
                    ? 'qty-shift-down'
                    : item.quantity > previousQty
                        ? 'qty-shift-up'
                        : '';
                total += subtotal;
                return `
                    <div class="cart-item">
                        <div><strong>${item.name}</strong></div>
                        <div class="cart-item-meta">
                            <div class="qty-controls">
                                <button class="qty-btn dec-item" data-idx="${idx}" title="Subtract">-</button>
                                <span class="qty-chip ${quantityClass}">${item.quantity}</span>
                                <button class="qty-btn inc-item" data-idx="${idx}" title="Add">+</button>
                            </div>
                            <div style="min-width:66px; text-align:right; font-weight:600;">$${subtotal.toFixed(2)}</div>
                            <button class="btn-secondary remove-item" data-idx="${idx}" style="padding:4px 8px;">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');

            previousCartQuantities = cart.reduce((acc, item) => {
                acc[item.id] = item.quantity;
                return acc;
            }, {});

            if (totalSpan) totalSpan.textContent = total.toFixed(2);

            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = Number(btn.getAttribute('data-idx'));
                    if (Number.isNaN(idx) || !cart[idx]) return;
                    cardAnimationState[cart[idx].id] = { type: 'decrease', at: Date.now() };
                    cart.splice(idx, 1);
                    updateCartUI();
                    if (currentPage === 'counter') {
                        renderCounter();
                    }
                });
            });

            document.querySelectorAll('.inc-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = Number(btn.getAttribute('data-idx'));
                    if (Number.isNaN(idx) || !cart[idx]) return;
                    const item = cart[idx];
                    const productStock = Number(products.find((p) => p.id === item.id)?.stock || 0);
                    if (item.quantity >= productStock) {
                        alert(`Only ${productStock} item(s) available for ${item.name}.`);
                        return;
                    }
                    cart[idx].quantity += 1;
                    cardAnimationState[cart[idx].id] = { type: 'increase', at: Date.now() };
                    updateCartUI();
                    if (currentPage === 'counter') {
                        renderCounter();
                    }
                });
            });

            document.querySelectorAll('.dec-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = Number(btn.getAttribute('data-idx'));
                    if (Number.isNaN(idx) || !cart[idx]) return;
                    const productId = cart[idx].id;
                    cart[idx].quantity -= 1;
                    cardAnimationState[productId] = { type: 'decrease', at: Date.now() };
                    if (cart[idx].quantity <= 0) {
                        cart.splice(idx, 1);
                    }
                    updateCartUI();
                    if (currentPage === 'counter') {
                        renderCounter();
                    }
                });
            });
        }

        function addToCart(product) {
            const productStock = Number(products.find((p) => p.id === product.id)?.stock || 0);
            if (productStock <= 0) {
                alert('This product is out of stock.');
                return;
            }

            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                if (existing.quantity >= productStock) {
                    alert(`Only ${productStock} item(s) available for ${product.name}.`);
                    return;
                }
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            cardAnimationState[product.id] = { type: 'increase', at: Date.now() };
            updateCartUI();
            if (currentPage === 'counter') {
                renderCounter();
            }
        }

        function getCartQuantityForProduct(productId) {
            const inCart = cart.find((item) => item.id === productId);
            return Number(inCart?.quantity || 0);
        }

        async function submitCartReservations() {
            if (cart.length === 0) {
                alert('Cart is empty');
                return;
            }

            const stockViolations = cart
                .map((item) => {
                    const stock = Number(products.find((p) => p.id === item.id)?.stock || 0);
                    return item.quantity > stock ? `${item.name}: requested ${item.quantity}, available ${stock}` : null;
                })
                .filter(Boolean);

            if (stockViolations.length > 0) {
                alert(`Please adjust quantities before sending reservation:\n${stockViolations.join('\n')}`);
                return;
            }

            const note = prompt('Optional note for this reservation request:', '');
            if (note === null) {
                return;
            }

            const results = await Promise.allSettled(
                cart.map((item) =>
                    fetch(`${API_BASE_URL}/product-reservations`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${accessToken}`
                        },
                        body: JSON.stringify({
                            productId: item.id,
                            quantity: item.quantity,
                            note: note.trim()
                        })
                    }).then(async (response) => {
                        const payload = await response.json().catch(() => ({}));
                        if (response.status === 401 || response.status === 403) {
                            localStorage.removeItem('access_token');
                            localStorage.removeItem('user');
                            window.location.href = 'login.html';
                            throw new Error('Please login again to continue.');
                        }
                        if (!response.ok) {
                            throw new Error(payload?.message || `Failed to reserve ${item.name}`);
                        }
                        return payload;
                    })
                )
            );

            const failed = results.filter((result) => result.status === 'rejected');
            const successCount = results.length - failed.length;

            if (successCount > 0) {
                cart = [];
                updateCartUI();
                await fetchProductsFromApi();
                await fetchMyProductReservations();
            }

            if (failed.length === 0) {
                alert('Reservation request sent to admin for approval.');
                navigateTo('product-reservations');
                return;
            }

            const failedMessages = failed
                .map((result) => result.reason?.message || 'Failed to submit reservation')
                .filter(Boolean)
                .join('\n');

            alert(
                successCount > 0
                    ? `Some reservation requests were submitted, but some failed:\n${failedMessages}`
                    : failedMessages
            );
        }

        function renderCounter(errorMessage) {
            const filteredProducts = products.filter((prod) =>
                !productSearchTerm || prod.name.toLowerCase().includes(productSearchTerm.toLowerCase())
            );

            const isMobileView = window.matchMedia('(max-width: 900px)').matches;
            const PRODUCTS_PER_PAGE = isMobileView ? 4 : 20;
            const totalPages = Math.max(1, Math.ceil(filteredProducts.length / PRODUCTS_PER_PAGE));
            if (productsPage >= totalPages) productsPage = Math.max(0, totalPages - 1);
            const pagedProducts = filteredProducts.slice(productsPage * PRODUCTS_PER_PAGE, (productsPage + 1) * PRODUCTS_PER_PAGE);

            const productsHtml = pagedProducts.map(prod => {
                const selectedQty = getCartQuantityForProduct(prod.id);
                const animationState = cardAnimationState[prod.id];
                const isAnimated = animationState && Number(animationState.at || 0) > (Date.now() - 250);
                const animationClass = isAnimated
                    ? animationState.type === 'decrease'
                        ? 'pill-drop'
                        : 'pill-bump'
                    : '';
                const remainingStock = Math.max(0, Number(prod.stock || 0) - selectedQty);

                return `
                    <div class="product-tile" data-id="${prod.id}" data-name="${prod.name}" data-price="${prod.price}">
                        <div class="product-topline">
                            <span class="stock-pill ${animationClass}">Stock ${remainingStock}</span>
                        </div>
                        <div style="display:flex; flex:1; flex-direction:column; justify-content:center; align-items:center; gap:4px; min-height:0;">
                            <span class="material-symbols-outlined" style="font-size:21px; color: var(--primary);">${prod.icon}</span>
                            <div style="font-weight:600; line-height:1.12; font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${prod.name}</div>
                            <div style="color: var(--primary-dark); font-size:12px;">$${prod.price.toFixed(2)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            const productsContent = errorMessage
                ? `<div style="padding:20px; color:#b91c1c;">${errorMessage}</div>`
                : isProductsLoading
                    ? '<div style="padding:20px; color:#64748b; text-align:center;">Loading products...</div>'
                : products.length === 0
                    ? '<div style="padding:20px; color:#64748b;">No products available yet. Ask admin to add products.</div>'
                    : filteredProducts.length === 0
                        ? '<div style="padding:20px; color:#64748b;">No products match your search.</div>'
                    : productsHtml;

            const paginationHtml = (!errorMessage && !isProductsLoading && filteredProducts.length > 0) ? `
                <div class="products-pagination">
                    <button class="page-nav-btn" id="prevPageBtn" ${productsPage === 0 ? 'disabled' : ''}>&#8249;</button>
                    <span class="page-nav-info">${productsPage + 1} / ${totalPages}</span>
                    <button class="page-nav-btn" id="nextPageBtn" ${productsPage >= totalPages - 1 ? 'disabled' : ''}>&#8250;</button>
                </div>
            ` : '';

            const availableProductsCount = isProductsLoading ? '-' : products.length;

            document.getElementById('pageContent').innerHTML = `
                <div class="client-hero">
                    <div class="hero-stat"><div class="label">Available Products</div><div class="value">${availableProductsCount}</div></div>
                    <div class="hero-stat"><div class="label">Cart Items</div><div class="value">${cart.reduce((sum, item) => sum + item.quantity, 0)}</div></div>
                    <div class="hero-stat"><div class="label">Today</div><div class="value" style="font-size:16px;">${new Date().toLocaleDateString()}</div></div>
                </div>
                <div class="panel" style="width:98%; margin:0 auto;">
                    <div class="pos-layout">
                        <div class="products-panel" style="padding:20px; width:98%; margin:0 auto;">
                            <div class="products-toolbar">
                                <input id="productSearchInput" class="products-search" placeholder="Search product..." value="${productSearchTerm.replace(/"/g, '&quot;')}" />
                                <div style="font-size:12px; font-weight:700; color:#1e3a8a; white-space:nowrap;">${filteredProducts.length}/${products.length}</div>
                            </div>
                            <div class="products-grid" style="border-right:none; padding:0;">${productsContent}</div>
                            ${paginationHtml}
                        </div>
                        <div class="cart-section">
                            <h3 style="margin-bottom: 10px;">Current Sale</h3>
                            <div id="cartItemsList" class="cart-items-list"></div>
                            <div style="font-weight:800; font-size:22px; margin:12px 0;">Total: $<span id="cartTotal">0.00</span></div>
                            <button class="btn-primary" id="checkoutBtn" style="margin-bottom:8px;">Send Reservation</button>
                            <button class="btn-secondary" id="clearCartBtn" style="width:100%; background:#ef4444; border-color:#dc2626; color:#fff !important;">Clear Cart</button>
                        </div>
                    </div>
                </div>
            `;

            document.querySelectorAll('.product-tile').forEach(tile => {
                tile.addEventListener('click', () => {
                    addToCart({
                        id: tile.getAttribute('data-id'),
                        name: tile.getAttribute('data-name'),
                        price: Number(tile.getAttribute('data-price'))
                    });
                });
            });

            document.getElementById('productSearchInput')?.addEventListener('input', (event) => {
                productSearchTerm = event.target.value || '';
                productsPage = 0;
                renderCounter();
            });

            document.getElementById('prevPageBtn')?.addEventListener('click', () => {
                if (productsPage > 0) { productsPage--; renderCounter(); }
            });

            document.getElementById('nextPageBtn')?.addEventListener('click', () => {
                const fp = products.filter(p => !productSearchTerm || p.name.toLowerCase().includes(productSearchTerm.toLowerCase()));
                const isMobileView = window.matchMedia('(max-width: 900px)').matches;
                const perPage = isMobileView ? 4 : 20;
                const tp = Math.max(1, Math.ceil(fp.length / perPage));
                if (productsPage < tp - 1) { productsPage++; renderCounter(); }
            });

            document.getElementById('checkoutBtn')?.addEventListener('click', async () => {
                await submitCartReservations();
            });

            document.getElementById('clearCartBtn')?.addEventListener('click', () => {
                cart = [];
                updateCartUI();
            });

            updateCartUI();
        }

        function renderReservations() {
            const upcomingCount = reservations.filter((reservation) => getReservationStatus(reservation.date, reservation.time) !== 'Completed').length;
            const rows = [...reservations]
                .sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`))
                .map((reservation) => {
                    const status = getReservationStatus(reservation.date, reservation.time);
                    const statusClass = status === 'Soon' ? 'status-soon' : status === 'Completed' ? 'status-completed' : 'status-upcoming';
                    return `
                        <tr>
                            <td>${reservation.customerName}</td>
                            <td>${formatReservationDate(reservation.date, reservation.time)}</td>
                            <td>${reservation.guests}</td>
                            <td>${reservation.tableNumber || '-'}</td>
                            <td>${reservation.contactNumber || '-'}</td>
                            <td><span class="status-pill ${statusClass}">${status}</span></td>
                            <td><button class="btn-secondary delete-reservation-btn" data-id="${reservation.id}">Delete</button></td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="7" style="text-align:center; color:#64748b;">No reservations yet.</td></tr>';

            document.getElementById('pageContent').innerHTML = `
                <div class="client-hero">
                    <div class="hero-stat"><div class="label">Upcoming</div><div class="value">${upcomingCount}</div></div>
                    <div class="hero-stat"><div class="label">Total Reservations</div><div class="value">${reservations.length}</div></div>
                    <div class="hero-stat"><div class="label">Earliest Slot</div><div class="value" style="font-size:16px;">${reservations.length ? formatReservationDate([...reservations].sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`))[0].date, [...reservations].sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`))[0].time) : 'Not set'}</div></div>
                </div>
                <div class="panel" style="margin-bottom:16px;">
                    <div style="padding:18px; border-bottom:1px solid var(--border);">
                        <h3>Reserve a Table</h3>
                    </div>
                    <div style="padding:18px;">
                        <form id="reservationForm">
                            <div class="reservation-form-grid">
                                <div class="field"><label>Customer Name</label><input type="text" id="reservationName" required /></div>
                                <div class="field"><label>Date</label><input type="date" id="reservationDate" required /></div>
                                <div class="field"><label>Time</label><input type="time" id="reservationTime" required /></div>
                                <div class="field"><label>Guests</label><input type="number" id="reservationGuests" min="1" max="30" value="2" required /></div>
                                <div class="field"><label>Table #</label><input type="text" id="reservationTable" /></div>
                                <div class="field"><label>Contact Number</label><input type="tel" id="reservationContact" /></div>
                            </div>
                            <button type="submit" class="btn-primary" style="width:auto; padding:10px 20px;">Save Reservation</button>
                        </form>
                    </div>
                </div>
                <div class="panel">
                    <table>
                        <thead><tr><th>Customer</th><th>Date & Time</th><th>Guests</th><th>Table</th><th>Contact</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;

            const dateInput = document.getElementById('reservationDate');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.min = today;
                dateInput.value = today;
            }

            document.getElementById('reservationForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const customerName = document.getElementById('reservationName').value.trim();
                const date = document.getElementById('reservationDate').value;
                const time = document.getElementById('reservationTime').value;
                const guests = Number(document.getElementById('reservationGuests').value);
                const tableNumber = document.getElementById('reservationTable').value.trim();
                const contactNumber = document.getElementById('reservationContact').value.trim();

                if (!customerName || !date || !time || !guests || guests < 1) {
                    alert('Please fill in all required fields.');
                    return;
                }

                const when = new Date(`${date}T${time}`);
                if (when < new Date()) {
                    alert('Reservation date/time must be in the future.');
                    return;
                }

                reservations.push({ id: Date.now(), customerName, date, time, guests, tableNumber, contactNumber });
                saveReservationsToStorage();
                renderReservations();
            });

            document.querySelectorAll('.delete-reservation-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = Number(btn.getAttribute('data-id'));
                    reservations = reservations.filter(r => r.id !== id);
                    saveReservationsToStorage();
                    renderReservations();
                });
            });
        }

        function renderProductReservations(errorMessage) {
            const productOptions = products.length
                ? products.map((product) => `<option value="${product.id}">${product.name} (Stock: ${product.stock})</option>`).join('')
                : '<option value="">No products available</option>';

            const rows = myProductReservations.length
                ? myProductReservations.map((item) => {
                    const status = String(item.status || 'pending').toLowerCase();
                    const statusClass = status === 'approved'
                        ? 'status-approved'
                        : status === 'rejected'
                            ? 'status-rejected'
                            : 'status-pending';

                    return `
                        <tr>
                            <td>${item.productName || '-'}</td>
                            <td>${item.quantity || 0}</td>
                            <td>${item.note || '-'}</td>
                            <td><span class="status-pill ${statusClass}">${status}</span></td>
                            <td>${item.adminNote || '-'}</td>
                            <td>${item.reviewedByName || '-'}</td>
                        </tr>
                    `;
                }).join('')
                : '<tr><td colspan="6" style="text-align:center; color:#64748b;">No product reservation requests yet.</td></tr>';

            const pendingCount = myProductReservations.filter((item) => String(item.status || '').toLowerCase() === 'pending').length;
            const approvedCount = myProductReservations.filter((item) => String(item.status || '').toLowerCase() === 'approved').length;

            document.getElementById('pageContent').innerHTML = `
                <div class="client-hero">
                    <div class="hero-stat"><div class="label">Pending Requests</div><div class="value">${pendingCount}</div></div>
                    <div class="hero-stat"><div class="label">Approved</div><div class="value">${approvedCount}</div></div>
                    <div class="hero-stat"><div class="label">Total Requests</div><div class="value">${myProductReservations.length}</div></div>
                </div>
                <div class="panel" style="margin-bottom:16px;">
                    <div style="padding:18px; border-bottom:1px solid var(--border);">
                        <h3>Reserve Products (Needs Admin Approval)</h3>
                    </div>
                    <div style="padding:18px;">
                        ${errorMessage ? `<div style="margin-bottom:12px; color:#b91c1c;">${errorMessage}</div>` : ''}
                        <form id="productReservationForm">
                            <div class="reservation-form-grid">
                                <div class="field">
                                    <label>Product</label>
                                    <select id="reservationProductId" required>${productOptions}</select>
                                </div>
                                <div class="field">
                                    <label>Quantity</label>
                                    <input type="number" id="reservationProductQty" min="1" value="1" required />
                                </div>
                                <div class="field" style="grid-column: 1 / -1;">
                                    <label>Note (optional)</label>
                                    <input type="text" id="reservationProductNote" maxlength="500" placeholder="Any note for admin approval" />
                                </div>
                            </div>
                            <button type="submit" class="btn-primary" style="width:auto; padding:10px 20px;">Submit For Approval</button>
                        </form>
                    </div>
                </div>

                <div class="panel">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Note</th>
                                <th>Status</th>
                                <th>Admin Note</th>
                                <th>Reviewed By</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;

            document.getElementById('productReservationForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();

                const productId = document.getElementById('reservationProductId').value;
                const quantity = Number(document.getElementById('reservationProductQty').value);
                const note = document.getElementById('reservationProductNote').value.trim();
                const selectedProduct = products.find((p) => p.id === productId);
                const stock = Number(selectedProduct?.stock || 0);

                if (!productId) {
                    alert('Please select a product');
                    return;
                }

                if (!quantity || quantity < 1) {
                    alert('Quantity must be at least 1');
                    return;
                }

                if (quantity > stock) {
                    alert(`Only ${stock} item(s) available for this product.`);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/product-reservations`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${accessToken}`
                        },
                        body: JSON.stringify({ productId, quantity, note })
                    });

                    const payload = await response.json();
                    if (!response.ok) {
                        throw new Error(payload?.message || 'Failed to submit reservation');
                    }

                    alert('Reservation sent to admin for approval.');
                    fetchProductsFromApi();
                    fetchMyProductReservations();
                } catch (error) {
                    alert(error?.message || 'Failed to submit product reservation');
                }
            });
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-page') === page);
            });

            if (page === 'counter') {
                renderCounter();
                return;
            }

            if (page === 'reservations') {
                renderReservations();
                return;
            }

            renderProductReservations();
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => navigateTo(tab.getAttribute('data-page')));
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            openLogoutModal();
        });

        logoutCancelBtn?.addEventListener('click', () => {
            closeLogoutModal();
        });

        logoutModalBackdrop?.addEventListener('click', (event) => {
            if (event.target === logoutModalBackdrop) {
                closeLogoutModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && logoutModalBackdrop?.classList.contains('open')) {
                closeLogoutModal();
            }
        });

        logoutConfirmBtn?.addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        window.addEventListener('resize', () => {
            if (currentPage === 'counter') {
                renderCounter();
            }
        });

        loadReservationsFromStorage();
        navigateTo(currentPage);
        fetchProductsFromApi();
        fetchMyProductReservations();
    </script>
</body>
</html>
